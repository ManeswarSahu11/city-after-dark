[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "city-after-dark"
version = "0.1.0"
description = "Evidence-aware multi-route analysis for Bengaluru-style trips"
authors = [{ name = "Maneswar Sahu", email = "maneswar.sahu2005@gmail.com" }]
maintainers = [{ name = "Maneswar Sahu", email = "maneswar.sahu2005@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]
